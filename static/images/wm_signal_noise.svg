<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="데이터 에너지는 방향이 뒤로 갈수록 급락하지만 양자화 잡음은 모든 방향에 고르게 퍼져 있다">
<style>
 .bg{fill:#f7f6f3}
 .t{font-family:'Helvetica Neue',Arial,sans-serif;font-size:13px;fill:#2b2823}
 .s{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;fill:#6b665c}
 .m{font-family:ui-monospace,Menlo,monospace;font-size:11px;fill:#6b665c}
 .bad{fill:#a33a22}.key{fill:#5b4a86}
 .grow{animation:g 7s ease-in-out infinite;transform-origin:0 250px}
 @keyframes g{0%{transform:scaleY(0)}22%,100%{transform:scaleY(1)}}
 .line{stroke-dasharray:700;stroke-dashoffset:700;animation:d 7s ease-in-out infinite}
 @keyframes d{0%,26%{stroke-dashoffset:700}54%,100%{stroke-dashoffset:0}}
 .lab{animation:f 7s ease-in-out infinite}
 @keyframes f{0%,56%{opacity:0}64%,100%{opacity:1}}
 .zone{animation:z 7s ease-in-out infinite}
 @keyframes z{0%,74%{opacity:0}82%,100%{opacity:1}}
</style>
<rect class="bg" width="760" height="320" rx="4"/>
<text class="s" x="20" y="24">한 분류 모델의 은닉 768방향 — 데이터가 쓰는 양과 int4 양자화 오차</text>
<rect class="zone" x="600" y="40" width="120" height="210" fill="#efe9f5"/>
<line x1="60" y1="250" x2="720" y2="250" stroke="#c9c4ba"/>
<line x1="60" y1="40" x2="60" y2="250" stroke="#c9c4ba"/>
<g class="m" text-anchor="end"><text x="54" y="46">1</text><text x="54" y="115">10⁻²</text><text x="54" y="184">10⁻⁴</text><text x="54" y="253">10⁻⁶</text></g>

<g class="grow" fill="#2f5d8c">
