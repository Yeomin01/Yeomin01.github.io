<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="서명이 유효해도 같은 논스가 두 번 오면 재전송으로 보고 거절한다">
<style>
  .bg{fill:#f7f6f3}
  .box{fill:#fff;stroke:#c9c4ba;stroke-width:1.2}
  .t{font-family:'Helvetica Neue',Arial,sans-serif;font-size:13px;fill:#2b2823}
  .s{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;fill:#6b665c}
  .m{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#2b2823}
  .ok{fill:#1f6b4a}.bad{fill:#a33a22}
  .p1{animation:go1 7s ease-in-out infinite}
  @keyframes go1{0%{transform:translateX(0);opacity:0}4%{opacity:1}
    26%{transform:translateX(430px);opacity:1}34%,100%{transform:translateX(430px);opacity:0}}
  .p2{animation:go2 7s ease-in-out infinite}
  @keyframes go2{0%,46%{transform:translateX(0);opacity:0}50%{opacity:1}
    72%{transform:translateX(430px);opacity:1}100%{transform:translateX(430px);opacity:1}}
  .accept{animation:ac 7s ease-in-out infinite}
  @keyframes ac{0%,26%{opacity:0}32%,44%{opacity:1}50%,100%{opacity:0}}
  .deny{animation:dn 7s ease-in-out infinite}
  @keyframes dn{0%,72%{opacity:0}78%,100%{opacity:1}}
  .book{animation:bk 7s ease-in-out infinite}
  @keyframes bk{0%,30%{opacity:0}36%,100%{opacity:1}}
</style>
<rect class="bg" width="760" height="300" rx="4"/>
<rect class="box" x="16" y="110" width="124" height="72" rx="3"/>
<text class="t" x="78" y="140" text-anchor="middle">보내는 쪽</text>
<text class="s" x="78" y="160" text-anchor="middle">매번 새 논스를 붙임</text>

<rect class="box" x="620" y="110" width="124" height="72" rx="3"/>
<text class="t" x="682" y="140" text-anchor="middle">받는 쪽</text>
<text class="s" x="682" y="160" text-anchor="middle">본 논스를 적어둔다</text>

<line x1="144" y1="146" x2="616" y2="146" stroke="#c9c4ba"/>

<g class="p1">
  <rect class="box" x="152" y="122" width="150" height="48" rx="3"/>
  <text class="m" x="227" y="142" text-anchor="middle">송금 1,000원</text>
  <text class="m" x="227" y="160" text-anchor="middle" fill="#6b665c">논스 a91f · 서명 8f2a</text>
</g>
<g class="p2">
  <rect class="box" x="152" y="122" width="150" height="48" rx="3" stroke="#a33a22" stroke-dasharray="4 3"/>
  <text class="m" x="227" y="142" text-anchor="middle">송금 1,000원</text>
  <text class="m bad" x="227" y="160" text-anchor="middle">논스 a91f · 서명 8f2a</text>
</g>

<g class="accept">
  <rect x="592" y="196" width="160" height="46" rx="3" fill="#e2f0e8" stroke="#1f6b4a"/>
  <text class="t ok" x="672" y="224" text-anchor="middle">서명 맞음 → 처리</text>
</g>
<g class="book">
  <rect class="box" x="596" y="52" width="152" height="44" rx="3"/>
  <text class="s" x="672" y="70" text-anchor="middle">본 논스 목록</text>
  <text class="m" x="672" y="88" text-anchor="middle">a91f</text>
</g>
<g class="deny">
  <rect x="576" y="196" width="184" height="62" rx="3" fill="#f6e6e1" stroke="#a33a22"/>
  <text class="t bad" x="668" y="218" text-anchor="middle">서명은 맞지만</text>
  <text class="t bad" x="668" y="238" text-anchor="middle">이미 본 논스 → 거절</text>
</g>

<text class="s" x="16" y="26">② 똑같은 요청을 그대로 복사해 다시 보내도 — 서명은 유효하다</text>
<text class="s bad" x="16" y="270">그래서 서명만으로는 재전송을 못 막는다. 한 번 쓴 논스를 기억해야 막힌다.</text>
</svg>
