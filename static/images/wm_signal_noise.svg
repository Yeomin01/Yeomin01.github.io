</g>
<polyline class="line" fill="none" stroke="#c26a2a" stroke-width="2.4"
 points="66,150 100,146 140,152 180,148 220,150 260,145 300,153 340,147 380,151 420,146 460,152 500,149 540,147 580,153 620,148 660,150 700,146 716,151"/>

<g class="lab">
  <rect x="90" y="56" width="12" height="3" fill="#2f5d8c"/>
  <text class="t" x="110" y="62">데이터가 쓰는 양</text>
  <rect x="250" y="56" width="12" height="3" fill="#c26a2a"/>
  <text class="t" x="270" y="62">양자화가 만드는 오차 — 평평하다</text>
</g>
<g class="zone">
  <text class="t key" x="660" y="60" text-anchor="middle">서명을 숨긴 곳</text>
  <text class="s bad" x="20" y="284">데이터는 0.03% 뿐인데 오차는 16.7% 가 여기 들어온다.</text>
  <text class="s bad" x="20" y="302">조용한 곳은 숨기기 좋은 만큼 지워지기도 쉽다.</text>
</g>
<text class="m" x="60" y="268">방향 1 — 데이터가 많이 쓰는 순서 →                                          768</text>
</svg>
